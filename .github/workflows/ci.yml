name: Shared CI contract tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract tests (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025-vs2026, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install test dependency
        shell: bash
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.1
      - name: Exercise workflow contracts
        shell: bash
        run: python tests/test_workflow.py
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
      - name: Provision isolated Linux SDK test toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build build-essential binutils pkg-config
          for tool in cmake ninja gcc g++ ld ar ranlib pkg-config as strip; do
            test -x "/usr/bin/$tool" || { echo "Missing SDK test tool /usr/bin/$tool" >&2; exit 1; }
          done
      - name: Check Rust CLI
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: "1.93.1"
        run: |
          cargo +1.93.1 fmt --check
          cargo +1.93.1 test --locked
          cargo +1.93.1 clippy --locked --all-targets -- -D warnings
          cargo +1.93.1 build --locked
          python tests/test_rust_parity.py
          python tests/test_qualification.py
          python tests/test_engine_bundle.py
