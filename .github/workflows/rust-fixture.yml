name: Reusable Rust fixture qualification

# Same-repository fixture only. This is not a production OBS build workflow.
on:
  workflow_call:
    inputs:
      targets:
        type: string
        default: ""
      obs-versions:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.93.1"
    outputs:
      engines: ${{ steps.plan.outputs.engines }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build qualification engine
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          cargo +1.93.1 build --release --locked
      - name: Plan fixture matrix
        id: plan
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          VERSIONS: ${{ inputs.obs-versions }}
        run: |
          matrix=$(python scripts/qualify.py plan --targets "$TARGETS" --obs-versions "$VERSIONS")
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
          engines=$(python scripts/engine_bundle.py matrix --matrix-json "$matrix")
          printf 'engines=%s\n' "$engines" >> "$GITHUB_OUTPUT"
      - name: Bundle Linux engine
        shell: bash
        run: |
          python scripts/engine_bundle.py pack --target linux-x86_64 --revision "$GITHUB_SHA" \
            --binary target/release/obs-ci --directory "$RUNNER_TEMP/engine-bundle"
      - name: Upload Linux engine
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: obs-ci-engine-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/engine-bundle/
          if-no-files-found: error
          retention-days: 14

  engines:
    needs: plan
    if: ${{ needs.plan.outputs.engines != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.engines) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: "1.93.1"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Build qualification engine
        shell: bash
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          cargo +1.93.1 build --release --locked
      - name: Bundle native engine
        shell: bash
        run: |
          binary=target/release/obs-ci
          if [ "$TARGET" = windows-x64 ]; then binary+=.exe; fi
          python scripts/engine_bundle.py pack --target "$TARGET" --revision "$GITHUB_SHA" \
            --binary "$binary" --directory "$RUNNER_TEMP/engine-bundle"
      - name: Upload native engine
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: obs-ci-engine-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-bundle/
          if-no-files-found: error
          retention-days: 14

  build:
    needs: [plan, engines]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.engines.result == 'success' || needs.engines.result == 'skipped') }}
    name: Fixture ${{ matrix.label }} / OBS layout ${{ matrix.obs }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      OBS_VERSION: ${{ matrix.obs }}
      EXTENSION: ${{ matrix.extension }}
      EMIT_SOURCE: ${{ matrix.emit_source }}
      ARTIFACT: ${{ format('rust-fixture-{0}-obs{1}-test', matrix.target, matrix.obs) }}
      RUSTUP_TOOLCHAIN: "1.93.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install fixture compiler
        shell: bash
        run: rustup toolchain install 1.93.1 --profile minimal
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: obs-ci-engine-${{ github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/engine
      - name: Compile and verify synthetic module
        shell: bash
        run: |
          engine=$(python scripts/engine_bundle.py verify --target "$TARGET" --revision "$GITHUB_SHA" --directory "$RUNNER_TEMP/engine")
          args=()
          if [ "$EMIT_SOURCE" = true ]; then args+=(--emit-source); fi
          python scripts/qualify.py build --engine "$engine" --work "$RUNNER_TEMP/rust-fixture" \
            --target "$TARGET" --obs-version "$OBS_VERSION" "${args[@]}"
      - name: Upload fixture binary and receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ runner.temp }}/rust-fixture/${{ env.ARTIFACT }}/${{ env.ARTIFACT }}.${{ env.EXTENSION }}
            ${{ runner.temp }}/rust-fixture/${{ env.ARTIFACT }}/SHA256SUMS
            ${{ runner.temp }}/rust-fixture/${{ env.ARTIFACT }}/MODULE-RECEIPT.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload fixture source and receipt
        if: matrix.emit_source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-fixture-source
          path: |
            ${{ runner.temp }}/rust-fixture/rust-fixture-source/rust-fixture-source.tar.gz
            ${{ runner.temp }}/rust-fixture/rust-fixture-source/SHA256SUMS
            ${{ runner.temp }}/rust-fixture/rust-fixture-source/PAYLOAD-SHA256SUMS
            ${{ runner.temp }}/rust-fixture/rust-fixture-source/SOURCE-RECEIPT.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  collect:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: obs-ci-engine-${{ github.sha }}-linux-x86_64
          path: ${{ runner.temp }}/engine
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: rust-fixture-*
          path: ${{ runner.temp }}/fixture-downloads
      - name: Reverify all downloaded artifacts
        shell: bash
        env:
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
        run: |
          engine=$(python scripts/engine_bundle.py verify --target linux-x86_64 --revision "$GITHUB_SHA" --directory "$RUNNER_TEMP/engine")
          python scripts/qualify.py collect --engine "$engine" --downloads "$RUNNER_TEMP/fixture-downloads" \
            --matrix-json "$MATRIX_JSON" --output "$RUNNER_TEMP/qualification.json"
      - name: Upload qualification report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rust-qualification-report
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
          retention-days: 14
