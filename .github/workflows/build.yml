name: Native OBS plugin build

on:
  workflow_call:
    inputs:
      module:
        description: Installed OBS module name
        required: true
        type: string
      package-name:
        description: Public archive and artifact name (defaults to module)
        required: false
        type: string
        default: ""
      profile:
        description: Matrix (full, linux, or linux-obs32)
        type: string
        default: full
      driver:
        description: Native default or caller-owned verification adapter
        type: string
        default: native
      checkout-submodules:
        description: Recursively initialize pinned public submodules
        type: boolean
        default: false
      required-paths:
        description: Additional caller-relative required files or directories (one per line)
        type: string
        default: ""
      engine-revision:
        description: Optional immutable obs-plugin-ci engine commit for same-run executable reuse (caller driver)
        type: string
        default: ""
      linux-sdk-cache:
        description: Opt in to exact-environment verified Linux SDK caching (shared caller adapter)
        type: boolean
        default: false
      source-package:
        description: Upload separately verified source archive and payload manifest
        type: boolean
        default: false
      upload-artifacts:
        description: Upload audited packages (false retains verification without distribution)
        type: boolean
        default: true
      minimum-tests:
        description: Minimum Linux regression test count
        required: true
        type: number

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      engines: ${{ steps.matrix.outputs.engines }}
    steps:
      - name: Select qualified matrix
        id: matrix
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          DRIVER: ${{ inputs.driver }}
          SOURCE_PACKAGE: ${{ inputs.source-package }}
          MODULE: ${{ inputs.module }}
          PUBLIC_NAME: ${{ inputs.package-name || inputs.module }}
          MINIMUM_TESTS: ${{ inputs.minimum-tests }}
          ENGINE_REVISION: ${{ inputs.engine-revision }}
          LINUX_SDK_CACHE: ${{ inputs.linux-sdk-cache }}
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          for key in ("MODULE", "PUBLIC_NAME"):
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_-]*", os.environ[key]):
                  raise SystemExit(f"Invalid {key}: expected an alphanumeric identifier with hyphens or underscores")
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["MINIMUM_TESTS"]):
              raise SystemExit("Invalid MINIMUM_TESTS: expected a positive integer")
          profile, driver, source = (os.environ[k] for k in ("PROFILE", "DRIVER", "SOURCE_PACKAGE"))
          if profile not in ("full", "linux-obs32", "linux") or driver not in ("native", "caller"):
              raise SystemExit("Unsupported matrix profile or driver")
          if source not in ("true", "false") or (source == "true" and driver != "caller"):
              raise SystemExit("Source packages require a caller-owned verifier")
          engine = os.environ.get("ENGINE_REVISION", "")
          if engine and (driver != "caller" or not re.fullmatch(r"[a-f0-9]{40}", engine)):
              raise SystemExit("Engine reuse requires caller driver and a full lowercase commit SHA")
          cache = os.environ.get("LINUX_SDK_CACHE", "false")
          if cache not in ("true", "false") or (cache == "true" and not engine):
              raise SystemExit("Linux SDK caching requires a pinned shared engine")
          rows = [
              {'target': 'linux-x86_64', 'label': 'Linux x86_64', 'runner': 'ubuntu-24.04', 'obs': '32.2.0', 'extension': 'tar.gz'},
              {'target': 'windows-x64', 'label': 'Windows x64', 'runner': 'windows-2025-vs2026', 'obs': '32.2.0', 'extension': 'zip'},
              {'target': 'macos-arm64', 'label': 'macOS Apple Silicon', 'runner': 'macos-26', 'obs': '32.2.0', 'extension': 'zip'},
              {'target': 'macos-x86_64', 'label': 'macOS Intel', 'runner': 'macos-26-intel', 'obs': '32.2.0', 'extension': 'zip'},
              {'target': 'linux-x86_64', 'label': 'Linux x86_64', 'runner': 'ubuntu-26.04', 'obs': '33.0.3', 'extension': 'tar.gz'},
              {'target': 'windows-x64', 'label': 'Windows x64', 'runner': 'windows-2025-vs2026', 'obs': '33.0.3', 'extension': 'zip'},
              {'target': 'macos-arm64', 'label': 'macOS Apple Silicon', 'runner': 'macos-26', 'obs': '33.0.3', 'extension': 'zip'},
              {'target': 'macos-x86_64', 'label': 'macOS Intel', 'runner': 'macos-26-intel', 'obs': '33.0.3', 'extension': 'zip'},
          ]
          if profile == "linux":
              rows = [r for r in rows if r["target"] == "linux-x86_64"]
          if profile == "linux-obs32":
              rows = [r for r in rows if r["target"] == "linux-x86_64" and r["obs"] == "32.2.0"]
          hosts = {}
          if engine:
              for row in rows:
                  hosts.setdefault(row["target"], {"target": row["target"], "runner": row["runner"]})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("matrix=" + json.dumps({"include": rows}, separators=(",", ":")) + "\n")
              out.write("engines=" + json.dumps({"include": list(hosts.values())}, separators=(",", ":")) + "\n")
          PYTHON

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}
      - name: Validate caller checkout
        shell: bash
        env:
          DRIVER: ${{ inputs.driver }}
          PROFILE: ${{ inputs.profile }}
          REQUIRED_PATHS: ${{ inputs.required-paths }}
          CHECKOUT_SUBMODULES: ${{ inputs.checkout-submodules }}
        run: |
          python3 - <<'PYTHON'
          import os, subprocess
          from pathlib import Path, PurePosixPath
          root = Path.cwd().resolve()
          paths = [line.strip() for line in os.environ["REQUIRED_PATHS"].splitlines() if line.strip()]
          scripts = root / ".github/scripts"
          if os.environ["DRIVER"] == "caller":
              files = [scripts / "ci-verify.sh"]
          else:
              files = [scripts / name for name in (
                  "prepare-obs32-sdk.sh", "verify-linux.sh", "test-verify-native.py",
                  "test-readme-links.py", "check_readme_links.py")]
              files.append(root / "README.md")
              if os.environ["PROFILE"] == "full":
                  files.append(scripts / "verify-native.py")
          missing = [str(p.relative_to(root)) for p in files if not p.is_file()]
          for name in paths:
              parts = name.split("/")
              if any(p in ("", ".", "..") for p in parts) or any(c in name for c in ("\\", ":")) or any(ord(c) < 32 for c in name):
                  raise SystemExit(f"Invalid required path: {name!r}")
              path = root.joinpath(*PurePosixPath(name).parts)
              if not path.resolve().is_relative_to(root):
                  raise SystemExit(f"Required path escapes checkout: {name!r}")
              if not (path.is_file() or path.is_dir()):
                  missing.append(name)
          if missing:
              raise SystemExit("Missing caller paths: " + ", ".join(missing))
          if os.environ["CHECKOUT_SUBMODULES"] == "true":
              status = subprocess.check_output(["git", "submodule", "status", "--recursive"], text=True)
              if any(not line.startswith(" ") for line in status.splitlines()):
                  raise SystemExit("Submodules not initialized at their pinned revisions")
          print("Caller checkout preflight passed")
          PYTHON

  engines:
    needs: plan
    if: inputs.engine-revision != ''
    name: Shared engine · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.engines) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      TARGET: ${{ matrix.target }}
      ENGINE_REVISION: ${{ inputs.engine-revision }}
      RUSTUP_TOOLCHAIN: "1.93.1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myrqyry/obs-plugin-ci
          ref: ${{ inputs.engine-revision }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Compile and bundle pinned engine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ENGINE_REVISION"
          rustup toolchain install 1.93.1 --profile minimal
          cargo +1.93.1 build --release --locked
          binary=target/release/obs-ci
          if [[ "$TARGET" == windows-x64 ]]; then binary+=.exe; fi
          python scripts/engine_bundle.py pack --target "$TARGET" --revision "$ENGINE_REVISION" \
            --binary "$binary" --directory "$RUNNER_TEMP/engine-bundle"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: obs-ci-engine-${{ inputs.module }}-${{ inputs.package-name || inputs.module }}-${{ inputs.engine-revision }}-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-bundle/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build:
    needs: [plan, engines]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.engines.result == 'success' || needs.engines.result == 'skipped') }}
    name: ${{ matrix.label }} · OBS ${{ matrix.obs }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      ENGINE_REVISION: ${{ inputs.engine-revision }}
      OBS_CI_LINUX_SDK_CACHE: ${{ inputs.linux-sdk-cache && matrix.target == 'linux-x86_64' }}
      MODULE: ${{ inputs.module }}
      PUBLIC_NAME: ${{ inputs.package-name || inputs.module }}
      MINIMUM_TESTS: ${{ inputs.minimum-tests }}
      OBS_VERSION: ${{ matrix.obs }}
      ARCHIVE: ${{ format('{0}-{1}-obs{2}-test.{3}', inputs.module, matrix.target, matrix.obs, matrix.extension) }}
      PUBLIC_ARCHIVE: ${{ format('{0}-{1}-obs{2}-test.{3}', inputs.package-name || inputs.module, matrix.target, matrix.obs, matrix.extension) }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.checkout-submodules && 'recursive' || 'false' }}
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        if: inputs.engine-revision != ''
        with:
          name: obs-ci-engine-${{ inputs.module }}-${{ inputs.package-name || inputs.module }}-${{ inputs.engine-revision }}-${{ matrix.target }}
          path: ${{ runner.temp }}/engine-received
      - name: Restore verified shared engine
        if: inputs.engine-revision != ''
        shell: bash
        run: |
          set -euo pipefail
          engine="$RUNNER_TEMP/obs-ci-engine"
          test ! -e "$engine"
          git init -q "$engine"
          git -C "$engine" fetch --depth=1 https://github.com/myrqyry/obs-plugin-ci.git "$ENGINE_REVISION"
          git -C "$engine" checkout --detach FETCH_HEAD
          test "$(git -C "$engine" rev-parse HEAD)" = "$ENGINE_REVISION"
          python "$engine/scripts/engine_bundle.py" verify --target "$TARGET" \
            --revision "$ENGINE_REVISION" --directory "$RUNNER_TEMP/engine-received"
          binary=obs-ci
          if [[ "$TARGET" == windows-x64 ]]; then binary+=.exe; fi
          mkdir -p "$engine/target/release"
          cp "$RUNNER_TEMP/engine-received/$binary" "$engine/target/release/"
          printf 'OBS_CI_ENGINE_ROOT=%s\n' "$engine" >> "$GITHUB_ENV"
      - name: Check README links and verifier tests
        if: runner.os == 'Linux' && inputs.driver == 'native'
        run: |
          python3 .github/scripts/test-verify-native.py
          python3 .github/scripts/test-readme-links.py
          python3 .github/scripts/check_readme_links.py README.md
      - name: Install native Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            xvfb xauth libgl1-mesa-dri qt6-base-dev qt6-base-private-dev qt6-svg-dev \
            extra-cmake-modules libsimde-dev uthash-dev uuid-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libpulse-dev libasound2-dev libjansson-dev libdrm-dev libegl-dev \
            libgl-dev libopengl-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcb-xinput-dev libglib2.0-dev zlib1g-dev
      - name: Prepare Linux SDK cache key
        if: inputs.linux-sdk-cache && runner.os == 'Linux'
        id: linux-sdk-key
        shell: bash
        run: bash "$OBS_CI_ENGINE_ROOT/scripts/run-linux-caller.sh" "$GITHUB_WORKSPACE" --sdk-cache-key
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: inputs.linux-sdk-cache && runner.os == 'Linux'
        with:
          path: |
            ${{ runner.temp }}/caller-work/obs/sdk
            ${{ runner.temp }}/caller-work/obs/SDK-RECEIPT.json
          key: ${{ steps.linux-sdk-key.outputs.key }}
      - name: Prepare pinned OBS SDK
        if: runner.os == 'Linux' && inputs.driver == 'native'
        run: bash .github/scripts/prepare-obs32-sdk.sh "$RUNNER_TEMP/obs-sdk" "$OBS_VERSION"
      - name: Build, test and verify Linux package
        if: runner.os == 'Linux' && inputs.driver == 'native'
        run: bash .github/scripts/verify-linux.sh "$RUNNER_TEMP/obs-sdk/sdk" "$RUNNER_TEMP/plugin-ci" "$MODULE" "$MINIMUM_TESTS"
      - name: Build, test and verify Windows or macOS package
        if: runner.os != 'Linux' && inputs.driver == 'native'
        shell: bash
        run: python .github/scripts/verify-native.py "$RUNNER_TEMP/plugin-ci" --obs-version "$OBS_VERSION"
      - name: Build and verify caller package
        if: inputs.driver == 'caller'
        shell: bash
        run: bash .github/scripts/ci-verify.sh
      - name: Verify artifact handoff
        shell: bash
        run: |
          python - <<'PYTHON'
          import gzip, hashlib, os, stat, tarfile, tempfile, zipfile
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "plugin-ci"
          archive = work / os.environ["ARCHIVE"]
          checksums = work / "SHA256SUMS"
          if archive.is_symlink() or checksums.is_symlink() or not archive.is_file() or not checksums.is_file() or archive.stat().st_size == 0:
              raise SystemExit("Missing or invalid verified package")
          with archive.open("rb") as f:
              digest = hashlib.file_digest(f, "sha256").hexdigest()
          expected = digest + "  " + archive.name + "\n"
          if checksums.read_text(encoding="utf-8") != expected:
              raise SystemExit("Archive name or SHA-256 mismatch")
          # Verify the container independently of the caller's module-specific
          # payload policy. Never extract untrusted members to the filesystem.
          entries = {}
          spellings = {}
          nonempty_files = 0

          def member(name, directory, size):
              global nonempty_files
              if directory and name.endswith("/"):
                  name = name[:-1]
              parts = name.split("/")
              if (any(p in ("", ".", "..") or p.endswith((" ", ".")) for p in parts)
                      or any(ord(c) < 32 or c in "\\\\:" for c in name)):
                  raise ValueError(f"Unsafe archive path: {name!r}")
              if any(p.casefold() in (".git", ".env") or p.casefold().endswith(".pdb") for p in parts):
                  raise ValueError(f"Forbidden archive payload: {name!r}")
              for end in range(1, len(parts) + 1):
                  prefix = "/".join(parts[:end])
                  previous = spellings.setdefault(prefix.casefold(), prefix)
                  if previous != prefix:
                      raise ValueError(f"Case-colliding archive paths: {previous!r}, {prefix!r}")
              if name in entries:
                  raise ValueError(f"Duplicate archive path: {name!r}")
              entries[name] = directory
              if not directory and size:
                  nonempty_files += 1

          try:
              if archive.name.endswith(".zip"):
                  with zipfile.ZipFile(archive) as package:
                      for info in package.infolist():
                          kind = stat.S_IFMT(info.external_attr >> 16)
                          if kind not in (0, stat.S_IFDIR if info.is_dir() else stat.S_IFREG):
                              raise ValueError(f"Unsupported ZIP member type: {info.filename!r}")
                          member(info.orig_filename, info.is_dir(), info.file_size)
                      bad = package.testzip()
                      if bad is not None:
                          raise ValueError(f"ZIP CRC mismatch: {bad!r}")
              elif archive.name.endswith(".tar.gz"):
                  with tarfile.open(archive, "r:gz") as package:
                      for info in package:
                          if not (info.isfile() or info.isdir()):
                              raise ValueError(f"Unsupported tar member type: {info.name!r}")
                          member(info.name, info.isdir(), info.size)
                          if info.isfile():
                              with package.extractfile(info) as stream:
                                  while stream.read(1024 * 1024):
                                      pass
                  # Tar readers can stop at the tar end marker before gzip
                  # verifies its footer. Drain the compressed stream too.
                  with gzip.open(archive, "rb") as stream:
                      while stream.read(1024 * 1024):
                          pass
              else:
                  raise ValueError("Unsupported package extension")
              if not nonempty_files:
                  raise ValueError("Archive has no nonempty regular files")
              for name in entries:
                  parts = name.split("/")
                  if any(entries.get("/".join(parts[:i])) is False for i in range(1, len(parts))):
                      raise ValueError(f"Archive file used as a directory: {name!r}")
          except (OSError, EOFError, ValueError, RuntimeError, tarfile.TarError, zipfile.BadZipFile) as exc:
              raise SystemExit(f"Invalid package archive: {exc}") from exc
          public = work / os.environ["PUBLIC_ARCHIVE"]
          if public.name != archive.name:
              # Path equality is case-insensitive on Windows. A case-only
              # alias is safe only if there is no distinct destination entry.
              case_only = public.name.casefold() == archive.name.casefold()
              if public.is_symlink() or (public.exists() and (
                      not case_only or not archive.samefile(public)
                      or any(p.name == public.name for p in work.iterdir()))):
                  raise SystemExit("Public archive already exists")
              if case_only:
                  temp = Path(tempfile.mkdtemp(dir=work))
                  intermediate = temp / archive.name
                  try:
                      archive.rename(intermediate)
                      try:
                          intermediate.rename(public)
                      except OSError:
                          intermediate.rename(archive)
                          raise
                  finally:
                      # If even rollback fails, retain the original archive
                      # in the temporary directory rather than deleting it.
                      if not intermediate.exists():
                          temp.rmdir()
              else:
                  archive.rename(public)
              expected = digest + "  " + public.name + "\n"
              checksums.write_text(expected, encoding="utf-8", newline="\n")
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8", newline="\n") as summary:
                  summary.write("### Verified module-only test package\n\n```\n" + expected + "```\n")
          PYTHON
      - name: Verify source package
        if: inputs.source-package && matrix.target == 'linux-x86_64' && matrix.obs == '32.2.0'
        shell: bash
        run: |
          python - <<'PYTHON'
          import gzip, hashlib, os, re, tarfile
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]) / "plugin-ci-source"
          archive = work / (os.environ["PUBLIC_NAME"] + "-source.tar.gz")
          checksums = work / "SHA256SUMS"
          payload = work / "PAYLOAD-SHA256SUMS"
          for path in (archive, checksums, payload):
              if path.is_symlink() or not path.is_file() or not path.stat().st_size:
                  raise SystemExit("Missing or invalid source package file")
          with archive.open("rb") as f:
              digest = hashlib.file_digest(f, "sha256").hexdigest()
          if checksums.read_text(encoding="utf-8") != digest + "  " + archive.name + "\n":
              raise SystemExit("Source archive SHA-256 mismatch")
          # Source archives have a different policy from binary packages.
          # Preserve source-specific licensing and tracked-file checks in the
          # caller, while requiring a safe, readable, single-root container.
          entries = {}
          spellings = {}
          roots = set()
          regular = set()
          try:
              with tarfile.open(archive, "r:gz") as package:
                  for info in package:
                      name = info.name
                      parts = name.split("/")
                      if (any(p in ("", ".", "..") or p.endswith((" ", ".")) for p in parts)
                              or any(ord(c) < 32 or c in "\\\\:" for c in name)):
                          raise ValueError(f"Unsafe source path: {name!r}")
                      if any(p.casefold() in (".git", ".env") for p in parts):
                          raise ValueError(f"Forbidden source path: {name!r}")
                      if not (info.isfile() or info.isdir()):
                          raise ValueError(f"Unsupported source member: {name!r}")
                      if info.isfile() and (len(parts) < 2 or re.search(
                              r"\.(?:so(?:\.[0-9]+)*|dll|dylib|exe|pdb|o|obj|a|lib|pyc)$", name, re.I)):
                          raise ValueError(f"Unexpected source file: {name!r}")
                      for end in range(1, len(parts) + 1):
                          prefix = "/".join(parts[:end])
                          if spellings.setdefault(prefix.casefold(), prefix) != prefix:
                              raise ValueError(f"Case-colliding source path: {name!r}")
                      if name in entries:
                          raise ValueError(f"Duplicate source path: {name!r}")
                      entries[name] = info.isdir()
                      roots.add(parts[0])
                      if info.isfile():
                          with package.extractfile(info) as stream:
                              while stream.read(1024 * 1024):
                                  pass
                          if info.size:
                              regular.add(name)
              with gzip.open(archive, "rb") as stream:
                  while stream.read(1024 * 1024):
                      pass
              if len(roots) != 1 or not regular:
                  raise ValueError("Source archive must have one root and nonempty files")
              for name in entries:
                  parts = name.split("/")
                  if any(entries.get("/".join(parts[:i])) is False for i in range(1, len(parts))):
                      raise ValueError(f"Source file used as directory: {name!r}")
              root = next(iter(roots))
              if not any(name.startswith(root + "/") and name.count("/") == 1
                         and re.fullmatch(r"(?:LICENSE|COPYING)(?:[._-].+)?", name.split("/")[-1], re.I)
                         for name in regular):
                  raise ValueError("Source archive missing root LICENSE or COPYING")
          except (OSError, EOFError, ValueError, tarfile.TarError) as exc:
              raise SystemExit(f"Invalid source package: {exc}") from exc
          lines = payload.read_text(encoding="utf-8").splitlines()
          if not lines:
              raise SystemExit("Empty payload checksum manifest")
          seen = set()
          for line in lines:
              entry = re.fullmatch(r"[a-f0-9]{64}  ([^\r\n]+)", line)
              if not entry:
                  raise SystemExit("Invalid payload checksum manifest")
              name = entry.group(1)
              if (not name.strip() or any(part in ("", ".", "..") for part in name.split("/"))
                      or any(ord(c) < 32 or c in "\\:" for c in name)):
                  raise SystemExit("Unsafe payload checksum path")
              if name in seen:
                  raise SystemExit("Duplicate payload checksum path")
              seen.add(name)
          PYTHON
      - name: Upload verified test package
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.package-name || inputs.module }}-${{ matrix.target }}-obs${{ matrix.obs }}-test
          path: |
            ${{ runner.temp }}/plugin-ci/${{ env.PUBLIC_ARCHIVE }}
            ${{ runner.temp }}/plugin-ci/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload verified source package
        if: inputs.upload-artifacts && inputs.source-package && matrix.target == 'linux-x86_64' && matrix.obs == '32.2.0'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ inputs.package-name || inputs.module }}-source
          path: |
            ${{ runner.temp }}/plugin-ci-source/${{ env.PUBLIC_NAME }}-source.tar.gz
