[package]
name = "obs-ci"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4.46"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
caseless = "0.2.2"

tempfile = "3"
goblin = "0.10.7"
